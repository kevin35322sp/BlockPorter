<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BlockPorter — Заявка</title>
  <link rel="stylesheet" href="style.css"/>
  <link rel="icon" href="logo.svg" type="image/svg+xml"/>
</head>
<body class="swap-body">
  <header class="header">
    <div class="container">
      <a href="index.html" class="logo">
        <img src="logo.svg" alt="BlockPorter" height="40"/>
      </a>
      <nav class="nav desktop-nav">
        <a href="index.html">Главная</a>
        <a href="dashboard.html" data-page="cross">CrossSwap</a>
        <a href="swap.html" data-page="swap">Swap</a>
        <a href="about.html">О сервисе</a>
        <a href="profile.html">Кабинет</a>
        <span id="auth-status"><a href="auth.html">Войти</a></span>
      </nav>
      <button class="burger" id="burger" type="button" aria-label="Меню" aria-controls="mobile-menu" aria-expanded="false">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
    <nav class="mobile-menu" id="mobile-menu">
      <button class="close-menu" id="close-menu" type="button" aria-label="Закрыть">×</button>
      <a href="index.html">Главная</a>
      <a href="dashboard.html" data-page="cross">CrossSwap</a>
      <a href="swap.html" data-page="swap">Swap</a>
      <a href="about.html">О сервисе</a>
      <a href="profile.html">Кабинет</a>
      <span id="auth-status-mobile"><a href="auth.html">Войти</a></span>
    </nav>
  </header>

  <main class="swap-main">
    <div class="swap-card glass-effect">
      <h1 class="swap-title">Заявка принята</h1>
      <div id="loader" class="loader" role="status" aria-label="Сохраняем"></div>
      <p id="processing-text" class="processing-message">Создаём заявку…</p>
      <p id="missing-receipt" class="error-message" hidden>Заявка не найдена. <a href="dashboard.html" data-page="cross">Создать заявку</a></p>
      <div id="result" hidden>
        <p id="result-lead" class="success-message">Заявка создана. Выплата поступит на указанные реквизиты.</p>
        <div id="result-body" class="swap-details"></div>
        <a class="btn primary-btn" href="dashboard.html" data-page="cross">Новая заявка</a>
      </div>
    </div>
  </main>
  <script src="app.js"></script>
  <script src="swap-data.js"></script>
  <script src="processing.js"></script>
</body>
</html>
