<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BlockPorter — Заявка Swap</title>
  <link rel="stylesheet" href="style.css?v=5"/>
  <link rel="icon" href="logo.svg" type="image/svg+xml"/>
</head>
<body class="swap-body" data-lock="swap">
  <header class="header">
    <div class="container">
      <a href="index.html" class="logo">
        <img src="logo.svg" alt="BlockPorter" height="40"/>
      </a>
      <nav class="nav desktop-nav">
        <a href="index.html">Главная</a>
        <a class="is-off" href="dashboard.html" data-page="cross" hidden>CrossSwap</a>
        <a class="is-off" href="swap.html" data-page="swap" hidden>Swap</a>
        <a href="about.html">О сервисе</a>
        <a href="profile.html">Кабинет</a>
        <span id="auth-status"><a href="auth.html">Войти</a></span>
      </nav>
      <button class="burger" id="burger" type="button" aria-label="Меню" aria-controls="mobile-menu" aria-expanded="false">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
    <nav class="mobile-menu" id="mobile-menu">
      <button class="close-menu" id="close-menu" type="button" aria-label="Закрыть">×</button>
      <a href="index.html">Главная</a>
      <a class="is-off" href="dashboard.html" data-page="cross" hidden>CrossSwap</a>
      <a class="is-off" href="swap.html" data-page="swap" hidden>Swap</a>
      <a href="about.html">О сервисе</a>
      <a href="profile.html">Кабинет</a>
      <span id="auth-status-mobile"><a href="auth.html">Войти</a></span>
    </nav>
  </header>

  <main class="swap-main">
    <div class="swap-card glass-effect">
      <h1 class="swap-title">Заявка</h1>
      <p id="page-closed" class="page-closed demo-banner" hidden>Страница Swap сейчас закрыта.</p>
      <div id="review-open" class="page-live" hidden>
        <p id="missing" class="error-message" hidden>Заявка не заполнена. <a href="swap.html">Вернуться к Swap</a></p>
        <div id="review-details" class="swap-details" hidden></div>
        <button id="go-pay" class="btn primary-btn" type="button" hidden>Обменять</button>
        <p id="review-status" class="hint" role="status"></p>
        <a id="edit-link" class="back-link" href="swap.html" hidden>Изменить данные</a>
      </div>
    </div>
  </main>
  <script src="app.js?v=5"></script>
  <script src="swap-data.js?v=5"></script>
  <script src="swap-review.js?v=5"></script>
</body>
</html>
